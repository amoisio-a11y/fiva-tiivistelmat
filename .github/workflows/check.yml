name: Tarkista uudet tiivistelmät

on:
  # Kerran päivässä klo 13.47 UTC (= 16.47 kesäaikaan, 15.47 talviaikaan).
  # Iltapäiväajo nappaa saman päivän julkaisut (Fiva julkaisee virka-aikaan).
  schedule:
    - cron: "47 13 * * *"
  # Käsin ajo Actions-välilehdeltä
  workflow_dispatch:
  # Ulkoinen ajastin (esim. cron-job.org) kuten Lounas-repossa:
  # POST https://api.github.com/repos/<omistaja>/<repo>/dispatches  {"event_type":"check"}
  repository_dispatch:
    types: [check]

permissions:
  contents: write

concurrency:
  group: fiva-tiivistelmat
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hae ja lähetä uudet
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
        run: python scraper.py

      - name: Tallenna tila
        if: always()
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "Päivitä nähdyt tiivistelmät"
            git push
          else
            echo "Ei muutoksia."
          fi
